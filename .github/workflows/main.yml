name: PiRadar Agent Runtime v3.1

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"  # existing 10-minute heartbeat, unchanged

permissions:
  contents: write

env:
  AGENT_MANIFEST_PATH: manifest/piradar_core_agent_v3.0.xml

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Validate XML manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = "manifest/piradar_core_agent_v3.0.xml"
          tree = ET.parse(path)
          root = tree.getroot()
          if root.tag != "agent":
              raise SystemExit("Manifest syntax error: Root tag must be <agent>")
          print("Manifest syntax OK")
          PY

      - name: Build verified Bitget V3 snapshot (fail closed)
        run: |
          set -euo pipefail
          node scripts/build-public-feed.js

      - name: Commit & push verified snapshot (only if changed)
        run: |
          set -euo pipefail
          git config user.name "PiRadar Agent"
          git config user.email "agent@piradar.local"
          git add out/priceSnapshot.json public/feed/now.json docs/feed/now.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update: verified Bitget V3 snapshot [skip ci]"
            git push
            echo "Verified snapshot committed & pushed."
          else
            echo "No changes to commit."
          fi
